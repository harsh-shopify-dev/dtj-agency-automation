# DTJ install catcher (design: docs/install-catcher-design.md). Deploy with tools/deploy.py, never by hand with secrets on a command line.
name = "dtj-install-catcher"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false  # one public address only: no per-version preview links
# account_id comes from the CLOUDFLARE_ACCOUNT_ID environment variable at deploy time

[[kv_namespaces]]
binding = "VAULT"
id = "d8f7f34509604af8b567376806a3b8bd"  # tools/deploy.py creates the namespace and writes its id here

[triggers]
crons = ["0 3 * * 1"]  # every Monday 03:00 UTC: refresh every store key (a refresh token dies after 90 days unused)

[vars]
BUILDER_CLIENT_ID = "5704872b2f8cb791487ab19c51530cca"  # DTJ Store Builder (tools/store_builder.py): the brand copy's app
# one entry per app copy, written by tools/add_client.py (client ids and store addresses are not secret)
